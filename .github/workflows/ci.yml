name: CI Pipeline

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Website
        run: |
          test -f index.html
          echo "Website file found successfully!"

      - name: Display Build Message
        run: echo "Build Success!"